# Coloque este arquivo em .github/workflows/build-android.yml.
# Autossuficiente: inclui o codigo-fonte de um PROTOTIPO, nao o jogo oficial.
# GitHub > Actions > Andy Voxel - APK > Run workflow > Artifacts.
# C++17 + JNI/Java; Android 7+ ARM; APK debug para instalacao de teste.
# Validado localmente: YAML, scripts e nucleo C++. Build Android nao executado aqui.
# Compatibilidade: https://developer.android.com/build/releases/agp-8-7-0-release-notes
# NDK: https://developer.android.com/guide/practices/page-sizes

name: Andy Voxel - APK
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/build-android.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
    - name: Instalar SDK, NDK e CMake
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
    - name: Configurar Gradle 8.9
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
        cache-disabled: true
    - name: Gerar projeto completo C++ e Android
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/andy-voxel"
        cd "$RUNNER_TEMP/andy-voxel"
        mkdir -p '.'
        cat > 'README.md' <<'ANDY_FILE_0'
        # Andy — Mundo de Brinquedos (protótipo)

        Jogo Android offline de blocos, em primeira pessoa, inspirado no quarto do
        Andy de Toy Story e na exploração/construção de Minecraft. Você controla um
        cowboy identificado como Woody no HUD, com manga xadrez amarela e mão em
        blocos. A representação é simples: não existe modelo completo do personagem.

        ## Como gerar o APK

        1. Salve o YAML em `.github/workflows/build-android.yml` no seu repositório GitHub.
        2. Na aba Actions, abra `Andy Voxel - APK` e clique em `Run workflow`.
           O workflow também executa quando esse arquivo é enviado por push.
        3. Ao finalizar, baixe `andy-voxel-apk` na seção Artifacts da execução.
        4. Extraia o ZIP e instale `andy-voxel-debug.apk` em um celular Android ARM.

        O YAML é autossuficiente: gera todos os fontes em uma pasta temporária do
        runner. Não precisa de código prévio, Gradle Wrapper ou secrets. A execução
        precisa de acesso aos serviços de dependências do Google, Maven e GitHub.
        Também publica `andy-voxel-source`, com o projeto gerado para continuar o
        desenvolvimento. Alterações feitas nesse ZIP não afetam o YAML; para futuras
        versões, altere os fontes embutidos ou adote um projeto separado com checkout.

        ## Controles

        - Arraste o lado esquerdo para andar; o joystick usa o ponto inicial do toque.
        - Arraste a área direita livre para olhar.
        - PULAR: salto; QUEBRAR: remove o bloco na mira; COLOCAR: adiciona um bloco.
        - BLOCO: alterna madeira, vermelho, azul, amarelo e verde. Alcance: 6 blocos.
        - Alterações nos blocos são salvas automaticamente. A posição reinicia ao abrir.
        - Para restaurar o cenário original, limpe os dados do aplicativo no Android.

        ## O que está implementado

        Mundo finito de 48 × 24 × 48 blocos; paredes azuis com nuvens; cama e colcha;
        janela; mesa; cômoda; caixa de brinquedos; tapete; pista e bola colorida.
        Móveis são grandes em relação ao jogador. Há gravidade, colisão, salto,
        edição, cinco materiais, controles multitoque e salvamento local do mundo.
        Renderização e lógica em C++17/OpenGL ES 1.1; Activity, ciclo de vida e
        controles em Java, conectados por JNI. Faces internas não são renderizadas;
        a malha é reenviada à GPU somente quando o mundo muda.

        ## Limites e validação

        É uma base jogável de escopo pequeno, não uma reprodução fiel do pacote
        Minecraft Toy Story: não contém mapa oficial, texturas oficiais, personagens
        animados, vozes, missões, crafting, inventário limitado ou multiplayer.
        O visual usa geometria e cores procedurais. O personagem é representado pelo
        HUD e braço em primeira pessoa. A fidelidade adicional exige produção de arte
        e expansão de gameplay.

        O núcleo C++ e a estrutura do YAML foram testados no ambiente de criação.
        O build Android completo e a execução em aparelho não foram realizados aqui.
        O workflow compila as duas ABIs, verifica assinatura e alinhamento do APK,
        e falha se a biblioteca nativa de qualquer ABI estiver ausente.
        Essas verificações de empacotamento não substituem testes em aparelho.

        APK debug assinado automaticamente para testes, Android 7.0+ (API 24),
        arm64-v8a e armeabi-v7a. Não é um pacote de publicação na Play Store.
        A chave de debug é temporária no runner: builds seguintes podem exigir
        desinstalar a versão anterior, o que remove o mundo salvo.

        ## Ferramentas fixadas

        AGP 8.7.3, Gradle 8.9, JDK 17, compile/target SDK 35, Build Tools 35.0.0,
        NDK 28.2.13676358, CMake 3.22.1. NDK r28 gera bibliotecas alinhadas a 16 KB.

        Referências técnicas:
        - https://developer.android.com/build/releases/agp-8-7-0-release-notes
        - https://developer.android.com/guide/practices/page-sizes
        - https://github.com/android-actions/setup-android
        - https://github.com/gradle/actions/tree/main/setup-gradle
        - https://github.com/actions/upload-artifact

        Para testar só a lógica no Linux: `g++ -std=c++17 -O2 core_test.cpp -o core-test`
        e depois `./core-test`.
        ANDY_FILE_0
        mkdir -p 'app'
        cat > 'app/build.gradle' <<'ANDY_FILE_1'
