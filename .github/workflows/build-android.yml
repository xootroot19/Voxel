    - name: Testar logica e compilar APK
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/andy-voxel"
        g++ -std=c++17 -O2 -Wall -Wextra -Werror core_test.cpp -o "$RUNNER_TEMP/andy-core-test"
        "$RUNNER_TEMP/andy-core-test"
        gradle --no-daemon --stacktrace --max-workers=2 :app:assembleDebug
    - name: Verificar APK e empacotar fontes
      shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/andy-voxel"
        mkdir -p "$GITHUB_WORKSPACE/dist"
        cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/andy-voxel-debug.apk"
        apk="$GITHUB_WORKSPACE/dist/andy-voxel-debug.apk"
        "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
        "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk"
        python3 - "$apk" <<'PY_CHECK'
        import sys, zipfile
        with zipfile.ZipFile(sys.argv[1]) as z:
            for abi in ('arm64-v8a', 'armeabi-v7a'):
                name = f'lib/{abi}/libandyvoxel.so'
                assert name in z.namelist(), f'Biblioteca ausente: {name}'
                assert z.getinfo(name).file_size > 0
        print('APK: ambas as arquiteturas nativas presentes.')
        PY_CHECK
        zip -q -r "$GITHUB_WORKSPACE/dist/andy-voxel-source.zip" . -x '.gradle/*' 'app/build/*' 'app/.cxx/*' 'local.properties'
        cd "$GITHUB_WORKSPACE/dist"
        sha256sum andy-voxel-debug.apk > SHA256SUMS.txt
        cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
        ## APK do protótipo pronto
        Baixe **andy-voxel-apk** em Artifacts, extraia e instale o APK em Android 7.0+ ARM.
        O projeto gerado está em **andy-voxel-source**.
        Protótipo voxel em primeira pessoa inspirado no Woody no quarto do Andy.
        Assinatura de debug temporária; uma nova execução pode exigir desinstalar a versão anterior.
        SUMMARY
    - name: Disponibilizar APK
      uses: actions/upload-artifact@v4
      with:
        name: andy-voxel-apk
        path: |
          dist/andy-voxel-debug.apk
          dist/SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 14
    - name: Disponibilizar fontes
      uses: actions/upload-artifact@v4
      with:
        name: andy-voxel-source
        path: dist/andy-voxel-source.zip
        if-no-files-found: error
        retention-days: 14
